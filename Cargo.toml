[package]
name = "NuhxBoard"
version = "2.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
derive_more = { version = "2.1.1", features = [
	"deref",
	"deref_mut",
	"display",
] }
smart-default = "0.7.1"
display-info = "0.5.10"
bitflags = "2.13.2"
confy = "2.0.0"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
# TODO: hyperbyor
smol-hyper = "0.1.1"
async-net = "2.0.0"
http-body-util = "0.1.5"
async-fs = "2.2.0"
async-tar = { version = "0.6.1", default-features = false, features = [
	# the deprecated async-std crate isn't actually used; i just have to choose
	# one of the runtime features and the tokio feature makes async-tar use tokio's io traits
	"runtime-async-std",
	"xattr",
] }
async-compression = { version = "0.4.52", features = ["futures-io", "gzip"] }
futures-util = { version = "0.3.34", features = ["io"] }
slint = "1.18.1"
futures-rustls = "0.26.0"
rustls-platform-verifier = "0.7.1"
anyhow = "1.0.104"

[build-dependencies]
slint-build = "1.18.1"
